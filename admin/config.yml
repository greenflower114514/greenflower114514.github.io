backend:
  name: git-gateway
  branch: main
  identity_url: https://dreamy-wisp-69ba57.netlify.app/.netlify/identity
  gateway_url: https://dreamy-wisp-69ba57.netlify.app/.netlify/git

site_url: https://dreamy-wisp-69ba57.netlify.app
display_url: https://dreamy-wisp-69ba57.netlify.app
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: blog_data
    label: Blog Diary
    files:
      - name: blog_entries
        label: Diary Entries
        file: assets/blog-entries.json
        format: json
        fields:
          - label: Entries
            name: entries
            widget: list
            collapsed: false
            summary: "{{fields.date}} - {{fields.type}} - {{fields.title}}"
            fields:
              - label: ID
                name: id
                widget: string
                hint: Use a date plus a short English slug, for example 2026-05-25-homepage-building.
              - label: Type
                name: type
                widget: string
                hint: Free text, such as daily, study, note, or build-log.
              - label: Date
                name: date
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: false
                format: YYYY-MM-DD
              - label: Title
                name: title
                widget: string
              - label: Excerpt
                name: excerpt
                widget: text
              - label: Content Paragraphs
                name: content
                widget: list
                collapsed: false
                field:
                  label: Paragraph
                  name: paragraph
                  widget: text
